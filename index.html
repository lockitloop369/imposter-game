<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imposter — word party game</title>
<meta name="description" content="Free online Imposter word game. Create a room, share the code and find the imposter with friends, with voice, video and chat. Play in 12 languages, online or on one phone.">
<meta property="og:title" content="Imposter — word party game">
<meta property="og:description" content="Everyone gets the same secret word, except the imposters. Give clues, discuss, vote. Play online with a room code or pass one phone around.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#12131c">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' https://unpkg.com; object-src 'none'; base-uri 'self'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🕵️%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#12131c;--card:#1d1f2e;--line:#2e3148;--txt:#eef0ff;--mut:#9aa0c3;--acc:#7c6cff;--red:#ff5d73;--grn:#3ddc97}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
main,section{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 8px;font-size:20px}
.mut{color:var(--mut);font-size:14px}
.big{font-size:34px;font-weight:800;margin:8px 0;word-break:break-word}
.code{font-size:38px;font-weight:800;letter-spacing:6px}
.center{text-align:center}
button{font:inherit;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:10px;padding:12px 16px;cursor:pointer;width:100%;margin-top:8px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
button.sm{width:auto;padding:6px 12px;margin:0;font-size:14px}
button.pick{background:var(--card);border:1px solid var(--line);text-align:left}
button.pick.on{border-color:var(--red);background:#3a1f2c}
input,select{font:inherit;color:var(--txt);background:#14151f;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
label{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>.fix{flex:0 0 auto}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
.timer{font-size:44px;font-weight:800;text-align:center;color:var(--grn)}
.imp{color:var(--red)}.ok{color:var(--grn)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut);margin-left:6px}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.tile{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:4/3}
.tile video{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:6px;bottom:4px;font-size:12px;background:#0008;padding:1px 6px;border-radius:6px}
#msgs{height:150px;overflow:auto;font-size:14px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><b>🕵️ Imposter</b><span id="hdr" class="mut"></span></header>
<main id="main"></main>
<section id="call" hidden><div class="card">
  <div class="row"><b>Call</b>
    <button class="sm fix" data-a="voice">🎤 Join voice</button>
    <button class="sm fix" data-a="video">📹 Join video</button>
    <button class="sm fix ghost" data-a="mute" hidden>Mute</button>
    <button class="sm fix ghost" data-a="leavecall" hidden>Leave call</button>
  </div><div id="tiles"></div></div></section>
<section id="chat" hidden><div class="card"><b>Chat</b><div id="msgs"></div>
  <form id="chatf" class="row"><input id="chatin" maxlength="200" placeholder="Message…" autocomplete="off"><button class="sm fix">Send</button></form></div></section>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game.js"></script>
</body>
</html>
